server:
  tomcat:

    # 3. Increase max Keep-Alive requests per connection
    max-keep-alive-requests: -1

    # Tomcat outlasts Hyperfoil's 30s frozen cooldown.
    # This prevents Tomcat from dropping the idle connections before the load test starts.
    connection-timeout: 45000

spring:
  datasource:
    username: fruits
    password: fruits
    url: jdbc:postgresql://localhost:5432/fruits
  jackson:
    default-property-inclusion: non_empty
  jpa:
    defer-datasource-initialization: true
    properties:
      hibernate:
        cache:
          # 1. Enable Hibernate's L2 Caching
          use_second_level_cache: true
          # 2. Configure the cache region factory (specifies the JCache/Caffeine provider)
          region:
            factory_class: jcache
